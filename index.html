    // --- FUNGSI UI & INDICATOR ---

    async function executeBulkAbaikanByDate() {
  const startDate = document.getElementById('bulkDateStart').value;
  const endDate = document.getElementById('bulkDateEnd').value;

  if (!startDate || !endDate) {
    return showToast("Pilih rentang tanggal terlebih dahulu!", true);
  }

  // 1. Filter data penjualan yang BELUM diproses dan berada dalam rentang tanggal
  const targetData = window.lastSalesData.filter(row => {
    const inv = row[0].trim();
    const tgl = row[1].split(' ')[0]; // Ambil YYYY-MM-DD dari kolom tanggal
    
    const isPending = !processedInvoices.has(inv);
    const isInRange = (tgl >= startDate && tgl <= endDate);
    
    return isPending && isInRange;
  });

  if (targetData.length === 0) {
    return showToast("Tidak ada transaksi pending pada tanggal tersebut.", true);
  }

  if (!confirm(`Terdapat ${targetData.length} transaksi pending di rentang ini. Abaikan semua?`)) return;

  const dataToShip = [];
  const nowTimestamp = new Date().toLocaleString('id-ID');

  // 2. Susun data untuk dikirim ke Sheets
  targetData.forEach(row => {
    const inv = row[0].trim();
    try {
      const items = JSON.parse(row[10]);
      items.forEach(item => {
        dataToShip.push([nowTimestamp, inv, item.nama.trim(), item.qty, "ABAIKAN"]);
      });
    } catch (e) {
      console.error("Error parsing items for invoice: " + inv);
    }
  });

  // 3. Eksekusi Pengiriman
  showToast(`Memproses ${targetData.length} transaksi...`);
  
  try {
    await fetch(SCRIPT_WEB_APP_URL, { 
      method: 'POST', 
      mode: 'no-cors', 
      body: JSON.stringify(dataToShip) 
    });

    showToast("Berhasil mengabaikan transaksi terpilih!");
    
    // Refresh data untuk memperbarui tampilan tabel
    fetchPenjualanData(); 

  } catch (err) {
    console.error(err);
    showToast("Gagal: " + err.message, true);
  } finally {
    setTimeout(hideToast, 2000);
  }
}
    
function setProcessingState(isProcessing) {
  const btn = document.getElementById('btnSubmitForm');
  const iconSave = document.getElementById('iconSave');
  const iconLoading = document.getElementById('iconLoading');
  const btnText = document.getElementById('btnText');

  if (isProcessing) {
    btn.disabled = true;
    iconSave.classList.add('hidden');
    iconLoading.classList.remove('hidden');
    btnText.innerText = "SEDANG MEMPROSES...";
  } else {
    btn.disabled = false;
    iconSave.classList.remove('hidden');
    iconLoading.classList.add('hidden');
    btnText.innerText = "SIMPAN TRANSAKSI";
  }
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('statusToast');
  const toastMsg = document.getElementById('toastMsg');
  const toastIcon = document.getElementById('toastIcon');
  
  toastMsg.innerText = msg;
  toast.classList.remove('-translate-y-24');
  toast.classList.add('translate-y-0');
  
  if(isError) {
    toast.classList.remove('bg-indigo-600'); 
    toast.classList.add('bg-red-600');
    toastIcon.className = 'fas fa-exclamation-triangle'; // Ikon peringatan untuk error
    setTimeout(() => hideToast(), 4000);
  } else {
    toast.classList.remove('bg-red-600'); 
    toast.classList.add('bg-indigo-600');
    toastIcon.className = 'fas fa-circle-notch animate-spin'; // Ikon loading untuk proses sukses/jalan
  }
}

function hideToast() {
  document.getElementById('statusToast').classList.replace('translate-y-0', '-translate-y-24');
}

   function setFilterDate(type) {
      const now = new Date();
      const btns = { today: 'btnFilterToday', month: 'btnFilterMonth', all: 'btnFilterAll' };
      Object.values(btns).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = "flex-1 bg-indigo-50 text-indigo-600 py-2 rounded-lg text-[10px] font-bold";
      });
      
      if (type === 'today') {
        const s = now.toISOString().split('T')[0];
        document.getElementById('dateStart').value = s;
        document.getElementById('dateEnd').value = s;
      } else if (type === 'month') {
        document.getElementById('dateStart').value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('dateEnd').value = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
      } else {
        document.getElementById('dateStart').value = ''; document.getElementById('dateEnd').value = '';
      }
      const activeBtn = document.getElementById(btns[type]);
      if (activeBtn) activeBtn.className = "flex-1 bg-indigo-600 text-white py-2 rounded-lg text-[10px] font-bold";
      filterRiwayat();
    }

    function filterRiwayat() {
  const q = document.getElementById('searchRiwayat').value.toLowerCase();
  const s = document.getElementById('dateStart').value;
  const e = document.getElementById('dateEnd').value;
  
  // 1. Filter data dari masterRiwayat
  filteredRiwayat = masterRiwayat.filter(item => {
    const tgl = item.created_at.split('T')[0];
    return item.nama_barang.toLowerCase().includes(q) && (!s || tgl >= s) && (!e || tgl <= e);
  });
  
  currentPage = 1; // Reset ke halaman 1 setiap kali filter berubah
  updatePaginationView();
}


function updatePaginationView() {
  const q = document.getElementById('searchRiwayat').value.toLowerCase();
  const s = document.getElementById('dateStart').value;
  const e = document.getElementById('dateEnd').value;
  
  // 1. Lakukan filtering langsung dari masterRiwayat
  const itemsTerfilter = masterRiwayat.filter(item => {
    const tgl = item.created_at.split('T')[0];
    const matchQuery = item.nama_barang.toLowerCase().includes(q) || 
                       (item.keterangan && item.keterangan.toLowerCase().includes(q));
    const matchDate = (!s || tgl >= s) && (!e || tgl <= e);
    return matchQuery && matchDate;
  });
  
  // 2. Hitung index untuk pagination
  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = startIndex + itemsPerPage;
  const paginatedItems = itemsTerfilter.slice(startIndex, endIndex);
  
  // 3. Kontrol Navigasi Pagination
  const nav = document.getElementById('paginationRiwayat');
  const totalPages = Math.ceil(itemsTerfilter.length / itemsPerPage);

  if (itemsTerfilter.length > itemsPerPage) {
    nav.classList.remove('hidden');
    document.getElementById('pageIndicator').innerText = `Hal ${currentPage} / ${totalPages}`;
    document.getElementById('btnPrev').disabled = currentPage === 1;
    document.getElementById('btnNext').disabled = endIndex >= itemsTerfilter.length;
  } else {
    nav.classList.add('hidden');
  }
  
  // 4. Panggil render dengan status kosong jika itemsTerfilter.length === 0
  renderRiwayat(paginatedItems, itemsTerfilter.length === 0, q);

  document.getElementById('stokForm').onsubmit = async function(e) {
  e.preventDefault();
  
  // Ambil data input
  const rows = document.querySelectorAll('#itemContainer > div');
  const ket = document.getElementById('inputKeterangan').value;
  const jenis = document.getElementById('inputJenisGlobal').value;

  // Validasi sederhana jika tidak ada barang yang diinput
  if (rows.length === 0) {
    showToast("Tambahkan minimal satu barang!", true);
    return;
  }

  // Aktifkan mode loading pada tombol dan tampilkan toast proses
  setProcessingState(true);
  showToast("Sedang menyimpan transaksi...");

  try {
    for (let row of rows) {
      const nama = row.querySelector('[name="namaBarang"]').value.toUpperCase();
      const qtyInput = row.querySelector('[name="jumlahBarang"]').value;
      const qty = parseInt(qtyInput);

      if (!nama || isNaN(qty)) continue; // Lewati jika ada baris kosong
      
      // 1. Ambil data stok saat ini dari Supabase
      const { data: cur, error: fetchError } = await _supabase
        .from('stok')
        .select('sisa')
        .eq('nama', nama)
        .maybeSingle();

      if (fetchError) throw fetchError;

      // 2. Kalkulasi perubahan stok
      const change = (jenis === 'Barang Masuk') ? qty : -qty;
      const newSisa = (cur ? cur.sisa : 0) + change;

      // 3. Update atau Insert ke tabel 'stok'
      if (cur) {
        const { error: updateError } = await _supabase
          .from('stok')
          .update({ sisa: newSisa })
          .eq('nama', nama);
        if (updateError) throw updateError;
      } else {
        const { error: insertError } = await _supabase
          .from('stok')
          .insert([{ nama: nama, sisa: change }]);
        if (insertError) throw insertError;
      }

      // 4. Catat ke tabel 'riwayat'
      const { error: historyError } = await _supabase
        .from('riwayat')
        .insert([{ 
          jenis: jenis, 
          nama_barang: nama, 
          jumlah: qty, 
          keterangan: ket 
        }]);
      if (historyError) throw historyError;
    }

    // --- BERHASIL ---
    showToast("Transaksi Berhasil Disimpan!");
    
    // Reset form
    document.getElementById('inputKeterangan').value = '';
    document.getElementById('itemContainer').innerHTML = '';
    addItemRow();
    
    // Tandai data perlu di-refresh saat tab dibuka
    dataLoaded.stok = false;
    dataLoaded.riwayat = false;

    // Sembunyikan toast sukses setelah 2 detik
    setTimeout(() => hideToast(), 2000);

  } catch (err) {
    // --- GAGAL ---
    console.error("Error saving transaction:", err);
    showToast("Gagal menyimpan: " + err.message, true);
  } finally {
    // Matikan mode loading tombol
    setProcessingState(false);
  }
};

  if (currentSalesFilter === 'pending') {

    filtered = data.filter(r => processedInvoices.has(r[0].trim()));

  if (searchText) {

      async function recalculateStock() {
  if (!confirm("Fitur ini akan menghitung ulang seluruh saldo stok berdasarkan Riwayat Transaksi. Lanjutkan?")) return;

  setProcessingState(true);
  showToast("Memulai kalkulasi ulang...");
  const syncIcon = document.getElementById('syncIcon');
  syncIcon?.classList.add('animate-spin');

  try {
    // 1. Ambil semua data riwayat
    const { data: allRiwayat, error: errR } = await _supabase
      .from('riwayat')
      .select('nama_barang, jumlah, jenis');
    
    if (errR) throw errR;

    // 2. Ambil semua produk yang terdaftar di tabel stok
    const { data: allStok, error: errS } = await _supabase
      .from('stok')
      .select('nama');
    
    if (errS) throw errS;

    // 3. Objek untuk menampung hasil perhitungan sementara
    let calcMap = {};
    
    // Inisialisasi semua barang yang ada di stok dengan angka 0
    allStok.forEach(s => calcMap[s.nama] = 0);

    // 4. Proses perhitungan berdasarkan riwayat
    allRiwayat.forEach(item => {
      const nama = item.nama_barang;
      const qty = parseInt(item.jumlah) || 0;
      
      if (!calcMap.hasOwnProperty(nama)) calcMap[nama] = 0;

      if (item.jenis === 'Barang Masuk') {
        calcMap[nama] += qty;
      } else {
        calcMap[nama] -= qty;
      }
    });

    // 5. Update ke database Supabase
    const entries = Object.entries(calcMap);
    let count = 0;

    for (const [nama, sisa] of entries) {
      const { error: upErr } = await _supabase
        .from('stok')
        .update({ sisa: sisa, updated_at: new Date().toISOString() })
        .eq('nama', nama);
      
      if (upErr) console.error(`Gagal update ${nama}:`, upErr);
      
      count++;
      updateProgress((count / entries.length) * 100);
    }

    showToast("Berhasil menghitung ulang stok!");
    dataLoaded.stok = false;
    loadStok(); // Refresh tampilan tabel

  } catch (err) {
    console.error(err);
    showToast("Gagal hitung ulang: " + err.message, true);
  } finally {
    syncIcon?.classList.remove('animate-spin');
    setProcessingState(false);
    updateProgress(0);
    setTimeout(hideToast, 2000);
  }
}
    
function renderStok(data) {
  const tbody = document.getElementById('tableStok');
  const searchTerm = document.getElementById('searchStok').value.toUpperCase();

  // Filter data berdasarkan input pencarian
  const filteredData = data.filter(item => 
    item.nama.toUpperCase().includes(searchTerm)
  );

  // Jika hasil filter kosong
  if (filteredData.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="2" class="px-4 py-10 text-center text-slate-400 italic text-sm">
          <i class="fas fa-box-open mb-2 text-2xl block opacity-20"></i><br>
          ${searchTerm ? `Barang "${searchTerm}" tidak ditemukan.` : 'Belum ada data stok.'}
        </td>
      </tr>`;
    return;
  }

  // Render data ke tabel
  tbody.innerHTML = filteredData.map(item => `
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="px-4 py-4 text-sm font-medium text-slate-700">${item.nama}</td>
      <td class="px-4 py-4 text-right font-bold ${item.sisa <= 0 ? 'text-red-500' : 'text-slate-900'}">
        ${item.sisa}
      </td>
    </tr>
  `).join('');
}
    
     function updateProgress(percent) {
      document.getElementById('topProgressBar').style.width = percent + '%';
    }

    // UTILS
    function parseCSV(text) {
      return text.split(/\r?\n/).map(line => {
        const res = []; let cur = '', q = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"' && line[i+1] === '"') { cur += '"'; i++; }
          else if (line[i] === '"') q = !q;
          else if (line[i] === ',' && !q) { res.push(cur); cur = ''; }
          else cur += line[i];
        }
        res.push(cur); return res;
      });
    }

     function initRealtime() {
  _supabase.channel('db-changes')
    // Listener untuk tabel Stok (Tetap ada)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stok' }, () => {
      if (!isProcessing) loadStok();
    })
    // Listener untuk tabel Riwayat (Baru: Menggantikan antrian)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'riwayat' }, () => {
      if (!isProcessing) loadRiwayat();
    })
    .subscribe();
}

    window.onload = () => { addItemRow(); loadStok(); initRealtime(); };
